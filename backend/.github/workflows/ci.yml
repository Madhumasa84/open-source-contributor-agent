name: Backend CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: osca
          POSTGRES_USER: osca
          POSTGRES_PASSWORD: osca
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -e ".[dev]"

    - name: Run migrations
      env:
        DATABASE_URL: postgresql+asyncpg://osca:osca@localhost:5432/osca
      run: |
        cd backend
        alembic upgrade head

    - name: Test with pytest
      env:
        DATABASE_URL: postgresql+asyncpg://osca:osca@localhost:5432/osca
        REDIS_URL: redis://localhost:6379/0
      run: |
        cd backend
        pytest tests/
